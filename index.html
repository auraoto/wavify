<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wavify - Музыкальный плеер</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23A046CA'/><text x='50' y='58' font-size='38' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>w</text></svg>">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Главное окно приложения (на весь экран) -->
  <div class="app-container" id="appContainer">
    
    <!-- Верхняя панель навигации -->
    <header class="top-nav">
      <div class="nav-arrows">
        <button class="nav-btn" id="btnHistoryBack" title="Назад (Alt+Left)" disabled>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
        <button class="nav-btn" id="btnHistoryForward" title="Вперед (Alt+Right)" disabled>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>

      <!-- Кнопка настроек (3 точки) -->
      <div class="nav-actions">
        <button class="settings-trigger-btn" id="settingsBtn" title="Настройки">
          <svg width="22" height="6" viewBox="0 0 14 4" fill="currentColor">
            <circle cx="2" cy="2" r="2" />
            <circle cx="7" cy="2" r="2" />
            <circle cx="12" cy="2" r="2" />
          </svg>
        </button>

        <!-- Окно настроек -->
        <div class="settings-popover" id="settingsPopover">
          <div class="settings-row">
            <label class="settings-label" data-i18n="accentColor">Акцентный цвет</label>
            <div class="color-picker-wrapper">
              <input type="color" id="accentColorInput" value="#A046CA" class="native-color-picker">
              <div class="color-preview-circle" id="accentColorPreview" style="background-color: #A046CA;"></div>
            </div>
          </div>
          
          <div class="settings-row">
            <label class="settings-label" data-i18n="siteName">Название</label>
            <input type="text" id="siteNameInput" class="settings-text-input" value="wavify" maxlength="20" spellcheck="false">
          </div>

          <div class="settings-row">
            <label class="settings-label" data-i18n="language">Язык</label>
            <div class="lang-switch-pills">
              <button type="button" class="lang-pill active" data-lang="ru">RU</button>
              <button type="button" class="lang-pill" data-lang="en">EN</button>
            </div>
          </div>

          <div class="preset-colors">
            <button type="button" class="preset-dot" style="background-color: #A046CA;" data-color="#A046CA" title="Purple"></button>
            <button type="button" class="preset-dot" style="background-color: #A238FF;" data-color="#A238FF" title="Deezer Purple"></button>
            <button type="button" class="preset-dot" style="background-color: #3B82F6;" data-color="#3B82F6" title="Blue"></button>
            <button type="button" class="preset-dot" style="background-color: #FF5500;" data-color="#FF5500" title="SoundCloud Orange"></button>
            <button type="button" class="preset-dot" style="background-color: #EC4899;" data-color="#EC4899" title="Pink"></button>
            <button type="button" class="preset-dot" style="background-color: #EAB308;" data-color="#EAB308" title="Yellow"></button>
          </div>
        </div>
      </div>
    </header>

    <!-- Основная рабочая область (сайдбар + контент) -->
    <div class="app-body">
      
      <!-- Левый капсульный сайдбар -->
      <aside class="sidebar-capsule">
        <div class="sidebar-top-items" id="sidebarItems">
          <!-- Только созданные пользователем плейлисты -->
        </div>

        <div class="sidebar-bottom-actions">
          <!-- Кнопка playlist вылезает только после нажатия на "+" -->
          <div class="sidebar-playlist-popout" id="sidebarPlaylistPopout">
            <button class="sidebar-pill-btn" id="btnSidebarPlaylistPill" title="Создать плейлист" data-i18n="playlist">playlist</button>
          </div>
          <button class="sidebar-add-btn" id="btnNewPlaylist" title="Создать плейлист">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
        </div>
      </aside>

      <!-- Центральная зона содержимого -->
      <main class="main-content" id="mainContent">
        
        <!-- Секция поиска -->
        <section class="search-section centered-mode" id="searchSection">
          
          <!-- Облачный логотип wavify -->
          <div class="logo-cloud-wrapper" id="logoWrapper">
            <div class="cloud-bubble-shape">
              <span class="cloud-logo-text" id="siteLogoText">wavify</span>
            </div>
          </div>

          <!-- Поисковая капсула -->
          <div class="search-bar-capsule">
            <div class="search-icon-slot">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </div>
            <input 
              type="text" 
              class="search-input" 
              id="searchInput" 
              placeholder="Введите название песни или автора для поиска..." 
              autocomplete="off"
              spellcheck="false"
            >
            <button class="search-clear-btn" id="searchClearBtn" title="Очистить">✕</button>
          </div>
        </section>

        <!-- Зона контента (Альбомы + Список треков) -->
        <div class="view-viewport" id="viewViewport">
          
          <!-- Секция АЛЬБОМА/ПЛЕЙЛИСТА (с изменяемым названием и аватаркой) -->
          <section class="details-hero-section" id="heroSection" style="display: none;">
            <div class="hero-cover-box" id="heroCoverBox">
              <img src="" alt="Cover" class="hero-cover-img" id="heroCoverImg" style="display: none;">
              <div class="hero-cover-placeholder" id="heroCoverPlaceholder">
                <span id="heroPlaceholderText">playlist</span>
              </div>
              <button class="hero-play-overlay" id="btnHeroPlay" title="Слушать">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
                  <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
              </button>
              
              <!-- Кнопка смены аватарки плейлиста -->
              <button type="button" class="hero-edit-cover-overlay" id="btnEditPlaylistCover" title="Изменить обложку">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                  <circle cx="12" cy="13" r="4"></circle>
                </svg>
                <span class="edit-cover-text" data-i18n="changeAvatar">Сменить фото</span>
              </button>
              <input type="file" id="playlistCoverFileInput" accept="image/*" style="display: none;">
            </div>

            <div class="hero-meta-box">
              <div class="hero-title-row">
                <h1 class="hero-title" id="heroTitle" title="Нажмите для переименования">Title</h1>
                <button type="button" class="hero-edit-title-btn" id="btnEditPlaylistTitle" title="Переименовать" style="display: none;">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                  </svg>
                </button>
                <button type="button" class="hero-pin-album-btn" id="btnPinAlbum" title="В колонку слева" style="display: none;">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                  </svg>
                </button>
              </div>
              <input type="text" class="hero-title-input" id="heroTitleInput" style="display: none;" maxlength="40">
              <p class="hero-author" id="heroAuthor">Author</p>
              <p class="hero-extra" id="heroExtra">Year of release</p>
            </div>
          </section>

          <!-- Витрина ВСЕХ найденных альбомов исполнителя (по референсу media_1789921242993.png) -->
          <section class="albums-showcase-section" id="albumsShowcaseSection" style="display: none;">
            <div class="albums-showcase-header">
              <h2 class="albums-showcase-title" data-i18n="albumsTitle">Альбомы</h2>
              <button type="button" class="albums-filter-reset-btn" id="btnResetAlbumFilter" style="display: none;" data-i18n="allTracks">Все треки</button>
            </div>
            <div class="albums-grid-row" id="albumsGridRow">
              <!-- Карточки ВСЕХ альбомов -->
            </div>
          </section>

          <!-- Список треков -->
          <section class="tracklist-section" id="tracklistSection">
            <div class="tracks-container" id="tracksContainer">
              <!-- Динамические капсулы треков -->
            </div>
            
            <div class="empty-state-notice" id="emptyNotice" style="display: none;">
              <p data-i18n="noTracksFound">Ничего не найдено. Попробуйте другой запрос или измените фильтр.</p>
            </div>

            <div class="loading-indicator" id="loadingIndicator" style="display: none;">
              <div class="spinner"></div>
              <p data-i18n="searching">Ищем на стримингах...</p>
            </div>
          </section>

        </div>

        <!-- Нижний аудиоплеер (капсула управления) -->
        <footer class="player-bar-capsule" id="playerBar">
          
          <!-- Левая часть: обложка, название, автор, + -->
          <div class="player-track-info">
            <div class="player-cover-thumbnail" id="playerCoverThumb">
              <img src="" alt="Thumbnail" id="playerThumbImg" style="display: none;">
              <div class="player-thumb-placeholder" id="playerThumbPlaceholder">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                </svg>
              </div>
            </div>
            <div class="player-text-meta">
              <div class="player-track-title" id="playerTrackTitle">wavify</div>
              <div class="player-track-author" id="playerTrackAuthor">Выберите трек</div>
            </div>
            <button class="player-add-btn" id="btnPlayerAddToPlaylist" title="Добавить в плейлист">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </button>
          </div>

          <!-- Центральная и правая часть: контроллеры, таймлайн, прогресс -->
          <div class="player-playback-controls">
            <div class="control-buttons">
              <button class="ctrl-btn" id="btnPrevTrack" title="Предыдущий (J)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                  <polygon points="19 20 9 12 19 4 19 20"></polygon>
                  <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="3" stroke-linecap="round"></line>
                </svg>
              </button>
              
              <button class="ctrl-btn play-pause-btn" id="btnPlayPause" title="Воспроизведение/Пауза (Space)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" id="playIcon">
                  <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" id="pauseIcon" style="display: none;">
                  <rect x="6" y="4" width="4" height="16" rx="1"></rect>
                  <rect x="14" y="4" width="4" height="16" rx="1"></rect>
                </svg>
              </button>

              <button class="ctrl-btn" id="btnNextTrack" title="Следующий (L)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                  <polygon points="5 4 15 12 5 20 5 4"></polygon>
                  <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="3" stroke-linecap="round"></line>
                </svg>
              </button>
            </div>

            <!-- Прогресс-бар с временем -->
            <div class="scrubber-bar-container">
              <span class="time-label current-time" id="currentTimeLabel">0:00</span>
              <div class="timeline-track" id="timelineTrack">
                <div class="timeline-fill" id="timelineFill"></div>
                <div class="timeline-thumb" id="timelineThumb"></div>
              </div>
              <span class="time-label total-time" id="totalTimeLabel">0:00</span>
            </div>

            <!-- Дополнительные контроллеры -->
            <div class="extra-controls">
              <!-- Текст песни (Genius) -->
              <button class="ctrl-btn mini-btn" id="btnLyrics" title="Текст песни (Genius)">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                  <line x1="9" y1="9" x2="15" y2="9"></line>
                  <line x1="9" y1="13" x2="13" y2="13"></line>
                </svg>
              </button>

              <button class="ctrl-btn mini-btn" id="btnRepeat" title="Повтор">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="17 1 21 5 17 9"></polyline>
                  <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                  <polyline points="7 23 3 19 7 15"></polyline>
                  <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                </svg>
              </button>

              <div class="volume-control-box">
                <button class="ctrl-btn mini-btn" id="btnVolumeMute" title="Громкость">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                  </svg>
                </button>
                <div class="volume-slider-track" id="volumeTrack">
                  <div class="volume-slider-fill" id="volumeFill" style="width: 80%;"></div>
                </div>
              </div>
            </div>

          </div>

        </footer>

      </main>
    </div>

    <!-- Модальное окно создания/редактирования плейлиста -->
    <div class="modal-backdrop" id="playlistModalBackdrop" style="display: none;">
      <div class="modal-card">
        <h3 class="modal-title" id="playlistModalTitle" data-i18n="createPlaylistTitle">Новый плейлист</h3>
        
        <div class="modal-avatar-picker">
          <div class="modal-avatar-preview" id="modalAvatarPreview">
            <span id="modalAvatarPlaceholder">cover</span>
            <img src="" alt="Avatar" id="modalAvatarImg" style="display: none;">
          </div>
          <div class="modal-avatar-actions">
            <button type="button" class="modal-btn secondary mini" id="btnPickModalAvatar" data-i18n="chooseAvatar">Выбрать обложку</button>
            <button type="button" class="modal-btn text mini" id="btnRemoveModalAvatar" style="display: none;" data-i18n="removeAvatar">Удалить</button>
          </div>
          <input type="file" id="modalAvatarFileInput" accept="image/*" style="display: none;">
        </div>

        <input type="text" id="newPlaylistNameInput" class="modal-input" placeholder="Название плейлиста..." maxlength="40">
        <div class="modal-actions">
          <button type="button" class="modal-btn secondary" id="btnCancelPlaylist" data-i18n="cancel">Отмена</button>
          <button type="button" class="modal-btn primary" id="btnConfirmPlaylist" data-i18n="create">Создать</button>
        </div>
      </div>
    </div>

    <!-- Модальное окно текстов песен (Genius Lyrics) -->
    <div class="lyrics-modal-backdrop" id="lyricsModalBackdrop" style="display: none;">
      <div class="lyrics-modal-card">
        <div class="lyrics-modal-header">
          <div class="lyrics-header-track">
            <img src="" alt="Cover" class="lyrics-track-thumb" id="lyricsTrackThumb" style="display: none;">
            <div class="lyrics-header-meta">
              <h3 class="lyrics-track-title" id="lyricsTrackTitle">Название трека</h3>
              <p class="lyrics-track-artist" id="lyricsTrackArtist">Исполнитель</p>
            </div>
          </div>
          <button type="button" class="lyrics-close-btn" id="btnCloseLyrics" title="Закрыть">✕</button>
        </div>
        <div class="lyrics-modal-body" id="lyricsModalBody">
          <div class="lyrics-loading" id="lyricsLoading" style="display: none;">
            <div class="spinner"></div>
            <p data-i18n="loadingLyrics">Ищем текст на Genius...</p>
          </div>
          <div class="lyrics-content" id="lyricsContent">
            <!-- Текст песни -->
          </div>
        </div>
        <div class="lyrics-modal-footer">
          <span class="lyrics-source-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            Genius Lyrics
          </span>
          <a href="#" target="_blank" rel="noopener noreferrer" class="lyrics-genius-link" id="lyricsGeniusLink" style="display: none;">Genius ↗</a>
        </div>
      </div>
    </div>

    <!-- Toast уведомление -->
    <div class="toast-notification" id="toastNotification">
      <span class="toast-text" id="toastText">Уведомление</span>
    </div>

  </div>

  <!-- Аудио элемент HTML5 -->
  <audio id="audioElement" preload="auto"></audio>

  <script src="app.js"></script>
</body>
</html>
